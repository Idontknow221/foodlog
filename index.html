<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark only">
<meta name="supported-color-schemes" content="dark">
<title>飲食紀錄・估算版</title>
<meta name="description" content="手機優先、可離線使用的飲食紀錄與熱量估算工具">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0F1114">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="toastRegion" class="toast-region" aria-live="polite"></div>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark">≈</span>
    <span class="brand-name">飲食紀錄</span>
  </div>
  <div id="statusBar" class="status-bar">
    <span id="onlineDot" class="status-dot"></span>
    <span id="statusText" class="status-text">檢查中…</span>
  </div>
</header>

<main id="app">

  <!-- DASHBOARD -->
  <section id="view-dashboard" class="view" data-view="dashboard">
    <h1 id="todayDateLabel" class="view-title"></h1>

    <div class="card goal-card">
      <div class="goal-card-top">
        <span class="goal-card-label">今日熱量・依目前紀錄估算</span>
        <span id="calProgressPct" class="goal-card-pct"></span>
      </div>
      <div class="progress-track">
        <div id="calProgressFill" class="progress-fill"></div>
      </div>
      <div id="calProgressLabel" class="goal-card-numbers"></div>
    </div>

    <div id="macroGrid" class="macro-grid"></div>

    <div class="section-block">
      <h2 class="section-heading">今日紀錄</h2>
      <div id="todayMealsList" class="meal-list"></div>
      <p id="todayEmptyHint" class="empty-hint" hidden>還沒有紀錄，點下方「新增」開始記錄第一餐。</p>
    </div>

    <div class="section-block">
      <h2 class="section-heading">建議・僅供參考</h2>
      <div id="recommendationsList" class="recommend-list"></div>
      <p class="disclaimer">以上建議是根據目前輸入與估算資料產生，僅供飲食紀錄與一般參考，非醫療建議。</p>
    </div>
  </section>

  <!-- ADD -->
  <section id="view-add" class="view" data-view="add" hidden>
    <h1 class="view-title">新增食物</h1>

    <button id="draftPhotoBtn" class="photo-capture-btn" type="button">
      <span class="photo-capture-icon">＋照片</span>
      <span class="photo-capture-sub">先拍照，之後再選食物（選用）</span>
    </button>
    <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
    <div id="draftPhotoPreview" class="draft-photo-preview" hidden></div>

    <div class="add-tabs" role="tablist">
      <button class="add-tab is-active" data-tab="quick" type="button">快速食物</button>
      <button class="add-tab" data-tab="recent" type="button">最近</button>
      <button class="add-tab" data-tab="favorites" type="button">最愛</button>
      <button class="add-tab" data-tab="search" type="button">搜尋</button>
    </div>

    <div id="tab-quick" class="add-tab-panel is-active">
      <div id="quickFoodsGrid" class="quick-grid"></div>
    </div>

    <div id="tab-recent" class="add-tab-panel">
      <div id="recentFoodsGrid" class="food-list"></div>
      <p id="recentEmptyHint" class="empty-hint" hidden>還沒有使用紀錄。</p>
    </div>

    <div id="tab-favorites" class="add-tab-panel">
      <div id="favoriteFoodsGrid" class="food-list"></div>
      <p id="favoriteEmptyHint" class="empty-hint" hidden>還沒有收藏的食物。點食物卡片上的星號即可收藏。</p>
    </div>

    <div id="tab-search" class="add-tab-panel">
      <input id="searchInput" class="search-input" type="search" placeholder="搜尋食物名稱…" autocomplete="off">
      <div id="searchResults" class="food-list"></div>
    </div>
  </section>

  <!-- PORTION SHEET (overlay) -->
  <div id="portionSheet" class="sheet" hidden>
    <div class="sheet-backdrop" id="portionBackdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="portionFoodName" class="sheet-title"></h2>
        <button id="portionFavToggle" class="fav-toggle" type="button" aria-label="收藏">☆</button>
      </div>
      <p id="portionPer100" class="portion-per100"></p>
      <div id="portionPhotoRow" class="portion-photo-row" hidden></div>

      <label class="portion-label" for="gramsRange">份量（公克）</label>
      <input id="gramsRange" type="range" min="10" max="500" step="5" value="100">
      <input id="gramsNumber" class="grams-number" type="number" min="1" max="2000" step="1" value="100">

      <div id="portionPreview" class="portion-preview"></div>

      <div class="sheet-actions">
        <button id="portionCancelBtn" class="btn btn-ghost" type="button">取消</button>
        <button id="portionConfirmBtn" class="btn btn-primary" type="button">確認加入</button>
      </div>
    </div>
  </div>

  <!-- HISTORY -->
  <section id="view-history" class="view" data-view="history" hidden>
    <h1 class="view-title">紀錄歷史</h1>
    <div id="historyList" class="history-list"></div>
    <p id="historyEmptyHint" class="empty-hint" hidden>還沒有任何紀錄。</p>
  </section>

  <!-- SETTINGS -->
  <section id="view-settings" class="view" data-view="settings" hidden>
    <h1 class="view-title">設定</h1>

    <div class="section-block">
      <h2 class="section-heading">每日目標・估算基準</h2>
      <div class="settings-form">
        <label>熱量 kcal <input id="goalCalories" type="number" min="0" step="10"></label>
        <label>蛋白質 g <input id="goalProtein" type="number" min="0" step="1"></label>
        <label>碳水 g <input id="goalCarbs" type="number" min="0" step="1"></label>
        <label>脂肪 g <input id="goalFat" type="number" min="0" step="1"></label>
      </div>
      <button id="saveGoalsBtn" class="btn btn-primary" type="button">儲存目標</button>
    </div>

    <div id="retrySection" class="section-block" hidden>
      <h2 class="section-heading">需要處理的紀錄</h2>
      <div id="retryList" class="meal-list"></div>
    </div>

    <div class="section-block">
      <h2 class="section-heading">照片儲存管理</h2>
      <p id="photoStorageStats" class="settings-stat"></p>
      <div class="settings-btn-row">
        <button id="clearOldPhotosBtn" class="btn btn-ghost" type="button">清除 30 天以前照片</button>
        <button id="clearAllPhotosBtn" class="btn btn-ghost" type="button">清除全部照片</button>
      </div>
      <p id="orphanHint" class="settings-stat"></p>
      <button id="orphanCleanupBtn" class="btn btn-ghost" type="button">執行完整孤兒照片清理</button>
      <div id="orphanProgressWrap" class="progress-track" hidden>
        <div id="orphanProgressFill" class="progress-fill"></div>
      </div>
      <div id="orphanProgressActions" hidden>
        <span id="orphanProgressLabel" class="settings-stat"></span>
        <button id="orphanCancelBtn" class="btn btn-ghost btn-small" type="button">中斷</button>
      </div>
    </div>

    <div class="section-block">
      <h2 class="section-heading">快速食物 / 最近 / 最愛</h2>
      <p class="settings-stat">快速食物固定 12 項，份量不可調整。</p>
      <div class="settings-btn-row">
        <button id="clearRecentsBtn" class="btn btn-ghost" type="button">清除最近使用</button>
        <button id="clearFavoritesBtn" class="btn btn-ghost" type="button">清除全部收藏</button>
      </div>
    </div>

    <div class="section-block">
      <h2 class="section-heading">本機 AI</h2>
      <p id="aiStatus" class="settings-stat"></p>
    </div>
  </section>

</main>

<nav id="bottomNav" class="bottom-nav">
  <button class="nav-btn is-active" data-view="dashboard" type="button"><span class="nav-icon">◐</span><span>今日</span></button>
  <button class="nav-btn" data-view="add" type="button"><span class="nav-icon">＋</span><span>新增</span></button>
  <button class="nav-btn" data-view="history" type="button"><span class="nav-icon">☰</span><span>歷史</span></button>
  <button class="nav-btn" data-view="settings" type="button"><span class="nav-icon">⚙</span><span>設定</span></button>
</nav>

<script src="./ai/local-ai.js"></script>
<script src="./app.js"></script>
</body>
</html>
